name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    name: Build dylib
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show available Xcode / SDKs (useful for debugging build failures)
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build AIUpscaleTweak.dylib
        working-directory: .
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIUpscaleTweak-dylib
          path: AIUpscaleTweak.dylib
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: AIUpscaleTweak-dylib
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AIUpscaleTweak.dylib
          generate_release_notes: true
