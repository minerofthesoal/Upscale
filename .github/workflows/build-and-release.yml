name: Build and Release

on:
  push:
    branches: [main]
    paths:
      - "AIUpscaleTweak.m"
      - "build.sh"
      - ".github/workflows/build-and-release.yml"
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    name: Build dylib
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show available Xcode / SDKs (useful for debugging build failures)
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build AIUpscaleTweak.dylib
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIUpscaleTweak-dylib
          path: AIUpscaleTweak.dylib
          if-no-files-found: error

  release:
    name: Auto-version and release
    needs: build
    # Only push events to main get released — PRs and manual runs just build,
    # so opening a PR or re-running the workflow doesn't mint extra versions.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full tag history needed to compute the next version

      - name: Bump version and push tag
        id: tag
        uses: anothrNick/github-tag-action@1.71.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          WITH_V: true

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: AIUpscaleTweak-dylib
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          files: dist/AIUpscaleTweak.dylib
          generate_release_notes: true
